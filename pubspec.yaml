name: mobile_asg
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  app_links: ^7.2.1
  http: ^1.6.0
  file_picker: ^12.0.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/brand/mydarah_mark.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/mydarah_mark.png
  adaptive_icon_background: "#FFF8F6"
  adaptive_icon_foreground: assets/brand/mydarah_mark.png
  min_sdk_android: 23
